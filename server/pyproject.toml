[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebot"
version = "0.1.0"
description = "Local voice bot: RealtimeSTT + Qwen3.5-9B + Kokoro TTS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "openai>=1.40",
]

[project.optional-dependencies]
transformers = ["transformers", "accelerate", "bitsandbytes>=0.45"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["voicebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["texts(list): transcripts the fake recorder returns, in order"]

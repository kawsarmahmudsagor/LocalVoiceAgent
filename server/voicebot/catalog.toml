# Pre-benchmark catalog: every pool entry except two, which cannot share the server venv:
# - chatterbox: chatterbox-tts pins torch 2.6.0 (spec §3.1).
# - kroko-en-128-rt: the kroko-onnx 1.12.9 wheel installs its own libonnxruntime.so (ONNX Runtime 1.17.1) into
#   sherpa_onnx/lib/, which breaks sherpa-onnx 1.13.4 ("version `VERS_1.27.0' not found"). It is still benchmarked
#   in venvs/bench-kroko; it returns as a worker (plan Task 16a) only if it makes the shortlist.
# The rest resolve in the server venv with torch 2.7.1+cu128. Task 11 (`python -m voicebot.bench.resolve`)
# replaces this file with the measured shortlist.
# sherpa-parakeet-v3: the k2-fsa archive was re-uploaded on 2026-11-07, so RealtimeSTT's pinned SHA-256 is stale.
# Its weights were fetched by hand and checked against GitHub's asset digest (sha256:1495e91b...).

[[entry]]
slug = "whisper-small-en"
kind = "stt"
role = "final"
engine = "faster_whisper"
model = "small.en"
device = "cuda"
family = "faster-whisper"

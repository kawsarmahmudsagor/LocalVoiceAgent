# ---------------- TTS ----------------
[[entry]]
slug = "kokoro"
kind = "tts"
engine = "KokoroEngine"
model = "kokoro"
device = "cuda"
family = "kokoro"
voice = "af_heart"

[[entry]]
slug = "qwen-cuda"
kind = "tts"
engine = "QwenEngine"
model = "qwen-talker-0.6b-base-Q8_0"
device = "cuda"
family = "qwen"
fetch = "manual:see RealtimeTTS/docs/engines/qwen.md (default Q8_0 talker and codec)"
options = { reference_audio = "assets/ref_voice.wav", reference_text_file = "assets/ref_voice.txt" }

[[entry]]
slug = "inflect-cuda"
kind = "tts"
engine = "InflectEngine"
model = "Inflect-Micro-v2"
device = "cuda"
family = "inflect"
options = { backend = "pytorch", device = "cuda:0" }

[[entry]]
slug = "piper"
kind = "tts"
engine = "PiperEngine"
model = "en_US-lessac-medium"
device = "cpu"
family = "piper"
fetch = "piper:en_US-lessac-medium"
options = { model_dir = "models/piper" }

[[entry]]

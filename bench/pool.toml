# Curated benchmark pool: v2 spec §3.1, plan Task 5. Schema: server/voicebot/catalog.py.
# Option keys come from each engine's doc under RealtimeSTT/docs/engines/ and RealtimeTTS/docs/engines/.
# Relative paths in options resolve against the repo root (the bench runners run from there).

# ---------------- Final STT ----------------
[[entry]]
slug = "whisper-small-en"
kind = "stt"
role = "final"
engine = "faster_whisper"
model = "small.en"
device = "cuda"
family = "faster-whisper"
options = { compute_type = "float16" }

[[entry]]
slug = "whisper-large-v3-turbo"
kind = "stt"
role = "final"
engine = "faster_whisper"
model = "large-v3-turbo"
device = "cuda"
family = "faster-whisper"
options = { compute_type = "float16" }

[[entry]]
slug = "transcribe-cpp-parakeet-q4"
kind = "stt"
role = "final"
engine = "transcribe_cpp"
model = "models/transcribe-cpp/parakeet-tdt-0.6b-v3-Q4_K_M.gguf"
device = "cuda"
family = "transcribe-cpp"
fetch = "manual:see RealtimeSTT/docs/engines/transcribe-cpp.md (download parakeet-tdt-0.6b-v3-Q4_K_M.gguf from handy-computer/parakeet-tdt-0.6b-v3-gguf into models/transcribe-cpp/)"
options = { backend = "cuda" }

[[entry]]
slug = "sherpa-parakeet-v3"
kind = "stt"
role = "final"
engine = "sherpa_onnx_parakeet"
model = "nvidia/parakeet-tdt-0.6b-v3"
device = "cpu"
family = "sherpa"
fetch = "sherpa:parakeet"
options = { provider = "cpu:assets/sherpa-cpu-session.conf", num_threads = 7, download_root = "models/sherpa-onnx" }

